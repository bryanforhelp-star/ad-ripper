<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdVault Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- reset / base ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #E5E5E5;
      color: #1A1A1A;
      min-height: 100vh;
      font-size: 13px;
    }

    /* ---------- desktop layout ---------- */
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    /* ---------- app header ---------- */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 0 2px;
    }
    .app-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #1A1A1A;
    }
    .app-tagline {
      font-size: 0.72rem;
      color: #8A8A8A;
      margin-top: 1px;
    }

    /* ---------- OS window shell ---------- */
    .os-window {
      background: #FFFFFF;
      border: 1px solid #C8C8C8;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      margin-bottom: 16px;
      overflow: hidden;
    }

    /* ---------- title bar ---------- */
    .title-bar {
      height: 36px;
      background: linear-gradient(to bottom, #F2F2F2, #E8E8E8);
      border-bottom: 1px solid #D0D0D0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      position: relative;
      user-select: none;
      flex-shrink: 0;
    }
    .traffic-lights {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-red    { background: #FF5F57; }
    .dot-yellow { background: #FFBD2E; }
    .dot-green  { background: #28C840; }
    .title-bar-label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.73rem;
      font-weight: 500;
      color: #8A8A8A;
      white-space: nowrap;
    }

    /* ---------- window body ---------- */
    .window-body {
      padding: 16px 18px;
    }

    /* ---------- form labels ---------- */
    label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #8A8A8A;
    }

    /* ---------- search row ---------- */
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ---------- inputs ---------- */
    input[type="text"], input[type="number"], select {
      background: #FFFFFF;
      border: 1px solid #C0C0C0;
      color: #1A1A1A;
      border-radius: 3px;
      padding: 5px 8px;
      font-size: 0.82rem;
      font-family: 'Inter', -apple-system, sans-serif;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
      transition: border-color .12s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: #4A90D9;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
    }

    /* ---------- checkbox ---------- */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-bottom: 2px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 13px;
      height: 13px;
      accent-color: #4A90D9;
      cursor: pointer;
    }
    .checkbox-group label {
      font-size: 0.82rem;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      color: #1A1A1A;
      cursor: pointer;
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      border: 1px solid #C0C0C0;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: 'Inter', -apple-system, sans-serif;
      cursor: pointer;
      background: #FFFFFF;
      color: #1A1A1A;
      box-shadow: 0 1px 2px rgba(0,0,0,0.07);
      transition: background .1s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: #F4F4F4; }
    .btn:active:not(:disabled) { background: #EAEAEA; box-shadow: none; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: #4A90D9;
      color: #FFFFFF;
      border-color: #3A80C9;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }
    .btn-primary:hover:not(:disabled) { background: #3A80C9; }
    .btn-primary:active:not(:disabled) { background: #2E70B9; box-shadow: none; }

    .btn-success { /* inherits base .btn */ }
    .btn-indigo  { color: #4A90D9; }

    .btn-sm {
      padding: 3px 10px;
      font-size: 0.74rem;
    }

    /* ---------- toolbar ---------- */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 7px 14px;
      background: #F5F5F5;
      border-bottom: 1px solid #E4E4E4;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-count {
      font-size: 0.72rem;
      color: #8A8A8A;
    }
    .select-all-label {
      font-size: 0.8rem;
      color: #1A1A1A;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ---------- ads grid ---------- */
    .ads-grid {
      display: flex;
      flex-direction: column;
    }

    /* ---------- ad card ---------- */
    .ad-card {
      background: #FFFFFF;
      border-bottom: 1px solid #EBEBEB;
      border-left: 2px solid transparent;
      padding: 11px 16px;
      transition: background .1s, border-left-color .08s;
    }
    .ad-card:last-child { border-bottom: none; }
    .ad-card:hover { background: #FAFAFA; }
    .ad-card.selected {
      border-left-color: #4A90D9;
      background: #F0F6FF;
    }
    .ad-card-header {
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }
    .ad-card-header input[type="checkbox"] {
      margin-top: 2px;
      width: 13px;
      height: 13px;
      accent-color: #4A90D9;
      flex-shrink: 0;
      cursor: pointer;
    }
    .ad-card-info { flex: 1; min-width: 0; }
    .ad-page-name {
      font-weight: 600;
      font-size: 0.8rem;
      color: #1A1A1A;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ad-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    /* ---------- badges ---------- */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.67rem;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .badge-date               { background: #F2F2F2; color: #5A5A5A; }
    .badge-days               { background: #F2F2F2; color: #5A5A5A; }
    .badge-platform           { background: #E8F0FA; color: #3A70C0; }
    .badge-status-downloaded  { background: #E6F4EA; color: #2A7A3A; }
    .badge-status-done        { background: #E6F4EA; color: #2A7A3A; }
    .badge-status-failed      { background: #FAE8E8; color: #B03030; }
    .badge-status-snapshot_only { background: #FDF4E4; color: #9A6010; }
    .badge-status-downloading { background: #E8F0FA; color: #3A70C0; }
    .badge-status-transcribing{ background: #F0EAFA; color: #6040A0; }
    .badge-status-pending     { background: #F2F2F2; color: #8A8A8A; }

    .ad-text {
      margin-top: 5px;
      font-size: 0.76rem;
      color: #6A6A6A;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ad-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }
    .ad-footer a {
      font-size: 0.72rem;
      color: #4A90D9;
      text-decoration: none;
    }
    .ad-footer a:hover { text-decoration: underline; }
    .ad-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* ---------- transcript ---------- */
    .transcript-box {
      margin-top: 8px;
      background: #F7F7F7;
      border: 1px solid #E2E2E2;
      border-radius: 3px;
      padding: 10px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.76rem;
      color: #3A3A3A;
      line-height: 1.65;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
    }
    .transcript-box.visible { display: block; }

    /* ---------- toasts ---------- */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      z-index: 9999;
    }
    .toast {
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-family: 'Inter', sans-serif;
      max-width: 300px;
      border: 1px solid #D0D0D0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      animation: slideIn .18s ease;
    }
    .toast-info    { background: #EEF4FB; color: #1A4880; border-color: #B8CFEA; }
    .toast-success { background: #EAF6EC; color: #1A5028; border-color: #B0D4B8; }
    .toast-error   { background: #FEF0F0; color: #8A2020; border-color: #EAB8B8; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- spinner ---------- */
    .spinner {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 1.5px solid rgba(0,0,0,0.15);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- empty state ---------- */
    .empty-state {
      text-align: center;
      padding: 52px 24px;
      color: #8A8A8A;
    }
    .empty-state .big-icon { font-size: 2rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.8rem; color: #8A8A8A; }
  </style>
</head>
<body>
<div class="app">

  <!-- App header -->
  <div class="app-header">
    <div>
      <div class="app-name">AdVault Local</div>
      <div class="app-tagline">Search · Download · Transcribe · Meta Ad Library</div>
    </div>
  </div>

  <!-- Search Window -->
  <div class="os-window">
    <div class="title-bar">
      <div class="traffic-lights">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <span class="title-bar-label">Search — Meta Ad Library</span>
    </div>
    <div class="window-body">
      <div class="search-row">
        <div class="field-group">
          <label for="brand">Brand</label>
          <input type="text" id="brand" placeholder="Nike, Apple, Coca-Cola…" style="width:200px" />
        </div>
        <div class="field-group">
          <label for="country">Country</label>
          <input type="text" id="country" value="US" style="width:70px" />
        </div>
        <div class="field-group">
          <label for="limit">Limit</label>
          <input type="number" id="limit" value="50" min="1" max="200" style="width:70px" />
        </div>
        <div class="field-group" style="justify-content:flex-end">
          <div class="checkbox-group">
            <input type="checkbox" id="active-only" checked />
            <label for="active-only">Active only</label>
          </div>
        </div>
        <div class="field-group" style="justify-content:flex-end">
          <button class="btn btn-primary" id="search-btn" onclick="doSearch()">
            <span id="search-spinner" class="spinner" style="display:none"></span>
            Search
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Results Window -->
  <div class="os-window">
    <div class="title-bar">
      <div class="traffic-lights">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <span class="title-bar-label">Results</span>
    </div>

    <!-- Toolbar (JS shows/hides) -->
    <div class="toolbar" id="toolbar" style="display:none">
      <div class="toolbar-left">
        <label class="select-all-label">
          <input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)" />
          Select all
        </label>
        <span class="result-count" id="result-count"></span>
      </div>
      <button class="btn btn-success" id="download-btn" onclick="doDownload()">
        <span id="dl-spinner" class="spinner" style="display:none"></span>
        Download Selected
      </button>
    </div>

    <!-- Ads Grid -->
    <div class="ads-grid" id="ads-grid"></div>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="big-icon">🔍</div>
      <p>Enter a brand name above and click Search.</p>
    </div>
  </div>

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let currentAds = [];       // [{meta_ad_id, page_name, ...}]
let jobMap = {};           // meta_ad_id -> job dict

// ---------------------------------------------------------------------------
// Toast
// ---------------------------------------------------------------------------
function toast(msg, type = 'info', duration = 4000) {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), duration);
}

// ---------------------------------------------------------------------------
// Spinner helpers
// ---------------------------------------------------------------------------
function showSpinner(id, btnId) {
  document.getElementById(id).style.display = 'inline-block';
  document.getElementById(btnId).disabled = true;
}
function hideSpinner(id, btnId) {
  document.getElementById(id).style.display = 'none';
  document.getElementById(btnId).disabled = false;
}

// ---------------------------------------------------------------------------
// Formatting helpers
// ---------------------------------------------------------------------------
function fmtDate(iso) {
  if (!iso) return '—';
  return iso.slice(0, 10);
}
function truncate(str, n = 220) {
  if (!str) return '';
  return str.length > n ? str.slice(0, n) + '…' : str;
}
function statusBadge(status) {
  if (!status) return '';
  const label = status.replace('_', ' ');
  return `<span class="badge badge-status-${status}">${label}</span>`;
}
function platformBadge(p) {
  return `<span class="badge badge-platform">${p}</span>`;
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------
async function doSearch() {
  const brand = document.getElementById('brand').value.trim();
  if (!brand) { toast('Enter a brand name', 'error'); return; }

  const country   = document.getElementById('country').value.trim() || 'US';
  const limit     = parseInt(document.getElementById('limit').value) || 50;
  const activeOnly = document.getElementById('active-only').checked;

  showSpinner('search-spinner', 'search-btn');
  document.getElementById('empty-state').style.display = 'none';

  try {
    const qs = new URLSearchParams({
      brand, country, limit,
      active_only: activeOnly,
    });
    const resp = await fetch(`/api/search?${qs}`);
    const data = await resp.json();

    if (!resp.ok) {
      toast(data.detail || 'Search failed', 'error', 6000);
      return;
    }

    currentAds = data.ads || [];
    jobMap = {};

    if (currentAds.length === 0) {
      document.getElementById('toolbar').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('empty-state').innerHTML =
        '<div class="big-icon">🤷</div><p>No ads found for this brand / filter.</p>';
    } else {
      renderAds(currentAds);
      toast(`Found ${currentAds.length} ads`, 'success');
      // Also load existing jobs
      loadJobs(brand);
    }
  } catch (err) {
    toast('Network error: ' + err.message, 'error', 6000);
  } finally {
    hideSpinner('search-spinner', 'search-btn');
  }
}

// support Enter key
document.getElementById('brand').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// ---------------------------------------------------------------------------
// Render ads
// ---------------------------------------------------------------------------
function renderAds(ads) {
  const grid = document.getElementById('ads-grid');
  grid.innerHTML = '';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('result-count').textContent = `${ads.length} ads`;

  ads.forEach(ad => {
    const card = buildAdCard(ad);
    grid.appendChild(card);
  });
}

function buildAdCard(ad) {
  const job = jobMap[ad.meta_ad_id];

  const card = document.createElement('div');
  card.className = 'ad-card';
  card.id = `card-${ad.meta_ad_id}`;

  const platforms = (ad.platforms || []).map(platformBadge).join('');
  const daysStr = ad.days_running != null
    ? `<span class="badge badge-days">${ad.days_running}d running</span>`
    : '';

  const jobStatusHtml = job ? statusBadge(job.status) : '';

  let actionHtml = '';
  if (job && (job.status === 'downloaded' || job.status === 'done')) {
    const hasTranscript = job.transcript_path;
    if (!hasTranscript) {
      actionHtml = `<button class="btn btn-indigo btn-sm" onclick="doTranscribe('${ad.meta_ad_id}', this)">
        Transcribe
      </button>`;
    }
  }

  card.innerHTML = `
    <div class="ad-card-header">
      <input type="checkbox" class="ad-checkbox" data-id="${ad.meta_ad_id}"
             onchange="onCheckboxChange(this)" />
      <div class="ad-card-info">
        <div class="ad-page-name">${escHtml(ad.page_name || '(unknown page)')}</div>
        <div class="ad-meta">
          <span class="badge badge-date">
            ${fmtDate(ad.start_time)} → ${ad.stop_time ? fmtDate(ad.stop_time) : 'active'}
          </span>
          ${daysStr}
          ${platforms}
          ${jobStatusHtml}
        </div>
        ${ad.ad_text ? `<div class="ad-text">${escHtml(truncate(ad.ad_text))}</div>` : ''}
      </div>
    </div>
    <div class="ad-footer">
      <div>
        ${ad.snapshot_url
          ? `<a href="${escHtml(ad.snapshot_url)}" target="_blank" rel="noopener">
               View snapshot ↗
             </a>`
          : '<span style="color:#8A8A8A;font-size:.72rem">No snapshot URL</span>'
        }
      </div>
      <div class="ad-actions" id="actions-${ad.meta_ad_id}">
        ${actionHtml}
      </div>
    </div>
    <div class="transcript-box" id="transcript-${ad.meta_ad_id}"></div>
  `;

  // Show transcript if already done
  if (job && job.status === 'done' && job.transcript_path) {
    loadTranscriptPreview(ad.meta_ad_id);
  }

  return card;
}

function refreshCard(ad) {
  const old = document.getElementById(`card-${ad.meta_ad_id}`);
  if (!old) return;
  const wasChecked = old.querySelector('.ad-checkbox')?.checked;
  const newCard = buildAdCard(ad);
  old.replaceWith(newCard);
  if (wasChecked) {
    newCard.querySelector('.ad-checkbox').checked = true;
    newCard.classList.add('selected');
  }
}

// ---------------------------------------------------------------------------
// Select all / checkbox
// ---------------------------------------------------------------------------
function toggleSelectAll(checked) {
  document.querySelectorAll('.ad-checkbox').forEach(cb => {
    cb.checked = checked;
    cb.closest('.ad-card').classList.toggle('selected', checked);
  });
}
function onCheckboxChange(cb) {
  cb.closest('.ad-card').classList.toggle('selected', cb.checked);
  // Update select-all state
  const all = document.querySelectorAll('.ad-checkbox');
  const checked = document.querySelectorAll('.ad-checkbox:checked');
  document.getElementById('select-all').checked = all.length > 0 && all.length === checked.length;
}

// ---------------------------------------------------------------------------
// Download
// ---------------------------------------------------------------------------
async function doDownload() {
  const brand = document.getElementById('brand').value.trim();
  if (!brand) { toast('Enter a brand name', 'error'); return; }

  const selected = [...document.querySelectorAll('.ad-checkbox:checked')]
    .map(cb => cb.dataset.id);

  if (selected.length === 0) {
    toast('Select at least one ad', 'error');
    return;
  }

  showSpinner('dl-spinner', 'download-btn');
  toast(`Downloading ${selected.length} ad(s)…`, 'info');

  try {
    const resp = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ brand, ad_ids: selected }),
    });
    const data = await resp.json();

    if (!resp.ok) {
      toast(data.detail || 'Download failed', 'error', 6000);
      return;
    }

    // Update jobMap and refresh cards
    (data.jobs || []).forEach(job => {
      if (job.meta_ad_id) jobMap[job.meta_ad_id] = job;
    });

    currentAds.forEach(ad => {
      if (jobMap[ad.meta_ad_id]) refreshCard(ad);
    });

    const done = (data.jobs || []).filter(j => j.status === 'downloaded').length;
    const snap = (data.jobs || []).filter(j => j.status === 'snapshot_only').length;
    const fail = (data.jobs || []).filter(j => j.status === 'failed').length;

    if (done > 0)  toast(`${done} ad(s) downloaded`, 'success');
    if (snap > 0)  toast(`${snap} ad(s): snapshot URL only (no direct media found)`, 'info', 6000);
    if (fail > 0)  toast(`${fail} ad(s) failed — see card for details`, 'error', 6000);

  } catch (err) {
    toast('Network error: ' + err.message, 'error', 6000);
  } finally {
    hideSpinner('dl-spinner', 'download-btn');
  }
}

// ---------------------------------------------------------------------------
// Transcribe
// ---------------------------------------------------------------------------
async function doTranscribe(metaAdId, btn) {
  const brand = document.getElementById('brand').value.trim();
  if (!brand) { toast('Enter a brand name', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Transcribing…';

  try {
    const resp = await fetch('/api/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ brand, ad_id: metaAdId }),
    });
    const data = await resp.json();

    if (!resp.ok) {
      toast(data.detail || 'Transcription failed', 'error', 6000);
      btn.disabled = false;
      btn.textContent = 'Transcribe';
      return;
    }

    // Update jobMap
    if (data.job) jobMap[metaAdId] = data.job;

    // Show transcript in card
    const transcriptEl = document.getElementById(`transcript-${metaAdId}`);
    if (transcriptEl && data.transcript) {
      transcriptEl.textContent = data.transcript;
      transcriptEl.classList.add('visible');
    }

    // Refresh card to hide transcribe button
    const ad = currentAds.find(a => a.meta_ad_id === metaAdId);
    if (ad) refreshCard(ad);

    toast('Transcription complete!', 'success');
  } catch (err) {
    toast('Network error: ' + err.message, 'error', 6000);
    btn.disabled = false;
    btn.textContent = 'Transcribe';
  }
}

// ---------------------------------------------------------------------------
// Load transcript preview (after re-render)
// ---------------------------------------------------------------------------
function loadTranscriptPreview(metaAdId) {
  // Transcript text is in jobMap if we fetched it; otherwise skip silently
  const job = jobMap[metaAdId];
  if (!job || !job.transcript_path) return;
  // We don't have the text itself in the job dict here,
  // only the path — the user can re-transcribe to see it.
}

// ---------------------------------------------------------------------------
// Load existing jobs from DB
// ---------------------------------------------------------------------------
async function loadJobs(brand) {
  try {
    const resp = await fetch(`/api/jobs?brand=${encodeURIComponent(brand)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    (data.jobs || []).forEach(job => {
      if (job.meta_ad_id) jobMap[job.meta_ad_id] = job;
    });
    // Re-render cards with job status
    currentAds.forEach(ad => refreshCard(ad));
  } catch (_) { /* non-critical */ }
}

// ---------------------------------------------------------------------------
// XSS helpers
// ---------------------------------------------------------------------------
function escHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('empty-state').style.display = 'block';
});
</script>
